# Luxy AI — Phase 4 full service isolation (BLUEPRINT.md §13.2)
#
# Every process in its own container, restart: unless-stopped, TimescaleDB
# for the candles hypertable, Redis with noeviction (never drop queue jobs).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# All services read env from .env (same file as the PM2 deployment).
# POSTGRES_PASSWORD must be set in .env — the default is dev-only.
# Service containers run the BUILT tsc output (dist/*), not tsx dev scripts.

x-service: &service
  build:
    context: .
    target: service
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgresql://luxy:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/luxydb
    REDIS_URL: redis://cache:6379
  depends_on:
    db:
      condition: service_healthy
    cache:
      condition: service_healthy
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  screener:
    <<: *service
    command: node dist/screener/index.js
    container_name: luxy-screener

  executor:
    <<: *service
    command: node dist/executor/index.js
    container_name: luxy-executor

  luxy-agent:
    <<: *service
    command: node dist/agents/luxy/index.js
    container_name: luxy-agent

  perps-agent:
    <<: *service
    command: node dist/agents/perps/index.js
    container_name: luxy-perps

  lp-agent:
    <<: *service
    command: node dist/agents/lp/index.js
    container_name: luxy-lp

  narrative-agent:
    <<: *service
    command: node dist/agents/narrative/index.js
    container_name: luxy-narrative

  polymarket-agent:
    <<: *service
    command: node dist/agents/polymarket/index.js
    container_name: luxy-polymarket

  candle-ingest:
    <<: *service
    command: node dist/market/ingest.js
    container_name: luxy-candles

  telegram-bot:
    <<: *service
    command: node dist/telegram/index.js
    container_name: luxy-telegram

  # LuxyEngine maintenance worker (BLUEPRINT §3.1 / §13.3.5).
  # Inference runs in-process in luxy-agent; enable with:
  #   docker compose -f docker-compose.prod.yml --profile engine up -d
  luxy-engine:
    <<: *service
    profiles: ["engine", "engine-torch"]
    command: node dist/engine/worker.js
    container_name: luxy-engine

  web:
    build:
      context: .
      target: web
    container_name: luxy-web
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://luxy:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/luxydb
      REDIS_URL: redis://cache:6379
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  db:
    # timescale image = postgres 16 + the timescaledb extension; the schema
    # auto-converts `candles` to a hypertable when the extension is present.
    image: timescale/timescaledb:latest-pg16
    container_name: luxy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: luxy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: luxydb
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luxy -d luxydb"]
      interval: 5s
      timeout: 5s
      retries: 10

  cache:
    image: redis:7-alpine
    container_name: luxy-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --appendonly yes
      --save 900 1
      --save 300 10
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg-data:
  redis-data:
